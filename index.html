<canvas id="c">
<style>
body{margin:0}
canvas{width:100vw;height:100vh}
</style>
<script>
let c=document.querySelector("#c"),x=c.getContext("2d"),d=devicePixelRatio,k={"w":0,"a":0,"s":0,"d":0},acs=1,dcs=0.5,xy=[0,0],ac=[0,0],max=10,min=-10
c.width=innerWidth*d
c.height=innerHeight*d
x.scale(d,d)
let cl=(v,m,n)=>{return Math.min(Math.max(v, m),n)}
let r=()=>{
let nxy=[k.d-k.a,k.s-k.w],l=Math.hypot(...nxy)
if(l){ac[0]=cl(nxy[0]*l*acs+ac[0],min,max);ac[1]=cl(nxy[1]*l*acs+ac[1],min,max)}
xy[0]=ac[0]+xy[0]
xy[1]=ac[1]+xy[1]
ac[0]=Math.sign(ac[0])*Math.max(Math.abs(ac[0])-dcs,0)
ac[1]=Math.sign(ac[1])*Math.max(Math.abs(ac[1])-dcs,0)
x.clearRect(0,0,c.width,c.height)
x.beginPath()
x.arc(...xy,100,0,Math.PI*2)
x.fillStyle = '#3498db'
x.fill()
x.closePath()
requestAnimationFrame(r)
}
r()
document.addEventListener("keydown",(e)=>{
k[e.key.toLowerCase()]=1
})
document.addEventListener("keyup",(e)=>{
k[e.key.toLowerCase()]=0
})
</script>
