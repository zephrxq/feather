<canvas id="c">
<style>
body{margin:0}
canvas{width:100vw;height:100vh}
</style>
<script>
let c=document.querySelector("#c"),x=c.getContext("2d"),d=devicePixelRatio, k={"w":0,"a":0,"s":0,"d":0},s=2
c.width=innerWidth*d
c.height=innerHeight*d
xy=[0,0]
x.scale(d,d)
let r=()=>{
xy[0]+=(k.d-k.a)*s
xy[1]+=(k.s-k.w)*s
x.clearRect(0,0,c.width,c.height)
x.fillRect(...xy,150,100)
requestAnimationFrame(r)
}
r()
document.addEventListener("keydown",(e)=>{
    k[e.key]=1
})
document.addEventListener("keyup",(e)=>{
    k[e.key]=0
})
</script>
